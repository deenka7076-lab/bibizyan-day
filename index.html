<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6e4df">
<title>Бибизяний день ❤️</title>
<style>
:root{--ink:#6d3e4d;--rose:#c66d83;--cream:#fff8f1;--pink:#f6e4df}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;color:var(--ink);font-family:Georgia,"Times New Roman",serif;background:radial-gradient(ellipse at 10% 10%,#fff7ef 0,transparent 35%),radial-gradient(ellipse at 90% 85%,#efc8d1 0,transparent 40%),linear-gradient(145deg,#f8e9dd,#f1d5dd);overflow-x:hidden}
body:before,body:after{content:"🌹";position:fixed;font-size:clamp(42px,10vw,90px);opacity:.20;pointer-events:none;z-index:0}
body:before{top:18px;left:10px;transform:rotate(-25deg)}body:after{right:10px;bottom:16px;transform:rotate(20deg)}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petal{position:absolute;top:-30px;animation:fall linear infinite;opacity:.45}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
main{position:relative;z-index:1;min-height:100svh;display:grid;place-items:center;padding:22px}
.panel{width:min(100%,520px);text-align:center;background:#fffaf4dc;border:1px solid #fff8f0;border-radius:28px;padding:clamp(24px,6vw,42px) clamp(20px,6vw,36px);box-shadow:0 18px 55px #8e52651c;backdrop-filter:blur(8px);animation:appear .55s ease both}
@keyframes appear{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.eyebrow{font:600 12px/1.5 system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#b46c7e}
h1{font-size:clamp(32px,8vw,48px);line-height:1.08;margin:12px 0 18px;font-weight:normal}
h2{font-size:clamp(25px,6vw,34px);font-weight:normal;margin:0 0 20px}
p{font-size:clamp(18px,4.7vw,22px);line-height:1.65;white-space:pre-line;margin:0 0 28px}
button{border:0;border-radius:999px;background:linear-gradient(135deg,#c66d83,#a94f6b);color:white;padding:14px 24px;font-size:16px;font-weight:600;box-shadow:0 8px 20px #a94f6b2b;cursor:pointer}
button:active{transform:scale(.98)}
.secondary{background:#f3dce1;color:#85485b;box-shadow:none;margin-top:10px}
.progress{height:4px;background:#efd8dc;border-radius:8px;overflow:hidden;margin:0 0 22px}
.progress span{display:block;height:100%;background:#c66d83;transition:width .3s}
.counter{font:13px system-ui,sans-serif;color:#a66c7a;margin-bottom:18px}
.cover-flower{font-size:34px;margin:8px 0 16px}
.photo{width:100%;max-height:48svh;object-fit:cover;object-position:center 40%;border-radius:18px;margin:2px 0 22px;box-shadow:0 8px 26px #8e52652a}
.hidden{display:none}
.heart{color:#c66d83}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>
<main>
<section class="panel" id="cover">

  <div class="cover-flower">🌷 🌹 🌷</div>
  <h1>10.10.2026<br><span class="heart">Бибизяний день</span></h1>
  <p>Маленькая история о том, почему ты для меня особенная 💗</p>
  <button id="start">Открыть ❤️</button>
</section>
<section class="panel hidden" id="story" aria-live="polite">
  <div class="progress"><span id="bar" style="width:7.69%"></span></div>
  <div class="counter" id="counter">Карточка 1 из 13</div>
  <h2 id="title"></h2>
  <p id="message"></p>
  <img class="photo hidden" id="photo" alt="Наша фотография вместе">
  <button id="next">Дальше ❤️</button>
  <div><button class="secondary hidden" id="again">Прочитать ещё раз 🌹</button></div>
</section>
</main>

const cover = document.getElementById("cover");
const story = document.getElementById("story");
const title = document.getElementById("title");
const message = document.getElementById("message");
const counter = document.getElementById("counter");
const bar = document.getElementById("bar");
const next = document.getElementById("next");
const photo = document.getElementById("photo");
const again = document.getElementById("again");
let index = 0;
function renderCard(){
  const card = cards[index];
  title.textContent = card.title;
  message.textContent = card.text;
  counter.textContent = `Карточка ${index+1} из ${cards.length}`;
  bar.style.width = `${((index+1)/cards.length)*100}%`;
  photo.classList.toggle("hidden", index !== cards.length-1);
  if(index === cards.length-1) photo.src = couplePhoto;
  next.textContent = index === cards.length-1 ? "В начало 💗" : "Дальше ❤️";
  again.classList.toggle("hidden", index !== cards.length-1);
  story.style.animation = "none";
  void story.offsetWidth;
  story.style.animation = "appear .45s ease both";
}
document.getElementById("start").addEventListener("click",()=>{cover.classList.add("hidden");story.classList.remove("hidden");index=0;renderCard()});
next.addEventListener("click",()=>{
  if(index < cards.length-1){index++;renderCard()}
  else {story.classList.add("hidden");cover.classList.remove("hidden")}
});
again.addEventListener("click",()=>{index=0;renderCard()});
const petals = document.getElementById("petals");
for(let i=0;i<14;i++){
 const el=document.createElement("span");el.className="petal";el.textContent=i%3===0?"🌸":"♡";
 el.style.left=(Math.random()*100)+"%";el.style.animationDuration=(9+Math.random()*12)+"s";
 el.style.animationDelay=(-Math.random()*18)+"s";el.style.fontSize=(14+Math.random()*14)+"px";
 petals.appendChild(el);
}
</script>
